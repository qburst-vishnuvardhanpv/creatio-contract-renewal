<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altum Contract Renewal</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-light: #eff6ff;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #f1f5f9;
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .contract-info {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .contract-info strong {
            color: var(--text-main);
        }

        /* Price Banner Box */
        .price-banner {
            display: inline-block;
            background-color: #f1f5f9;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .price-banner strong {
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
        }

        .instruction-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Option Container Styles */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-card {
            position: relative;
        }

        .option-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .option-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radio-custom {
            width: 20px;
            height: 20px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .radio-custom::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: var(--primary);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.2s ease;
        }

        .plan-details {
            display: flex;
            flex-direction: column;
        }

        .plan-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .plan-subtext {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 20px;
            background-color: #f1f5f9;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Hover & Selection States */
        .option-card:hover .option-label {
            border-color: #93c5fd;
            background-color: #f8fafc;
        }

        .option-card input[type="radio"]:checked+.option-label {
            border-color: var(--primary);
            background-color: var(--accent-light);
        }

        .option-card input[type="radio"]:checked+.option-label .radio-custom {
            border-color: var(--primary);
        }

        .option-card input[type="radio"]:checked+.option-label .radio-custom::after {
            transform: scale(1);
        }

        .option-card input[type="radio"]:checked+.option-label .badge {
            background-color: #dbeafe;
            color: var(--primary);
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .btn-decline {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 14px;
            padding: 8px;
            transition: color 0.2s ease;
        }

        .btn-decline:hover {
            color: var(--danger);
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header">
            <h2>Contract Renewal Selection</h2>
            <p class="contract-info">Renewing Contract: <strong id="displayContractName">Your Contract</strong></p>

            <!-- Price display banner -->
            <div class="price-banner" id="priceBanner" style="display: none;">
                Base Rate: <strong id="displayPrice">$0</strong> / year
            </div>

            <p class="instruction-text">Please select your preferred renewal plan below.</p>
        </div>

        <!-- FORM START -->
        <form id="renewalForm" onSubmit="createObject(); return false;">
            <input type="hidden" id="QBTContractNumber" name="QBTContractNumber" value="" />
            <input type="hidden" id="RenewalAction" name="RenewalAction" value="RENEW" />

            <div class="options-group">
                <!-- 1-Year Option -->
                <div class="option-card">
                    <input type="radio" name="QBTAltumContractTenure" id="t12" value="12" checked>
                    <label for="t12" class="option-label">
                        <div class="option-content">
                            <span class="radio-custom"></span>
                            <div class="plan-details">
                                <span class="plan-title">1-Year Plan</span>
                                <span class="plan-subtext" id="subtext-t12">12 Months</span>
                            </div>
                        </div>
                        <span class="badge">STANDARD</span>
                    </label>
                </div>

                <!-- 2-Year Option -->
                <div class="option-card">
                    <input type="radio" name="QBTAltumContractTenure" id="t24" value="24">
                    <label for="t24" class="option-label">
                        <div class="option-content">
                            <span class="radio-custom"></span>
                            <div class="plan-details">
                                <span class="plan-title">2-Year Plan</span>
                                <span class="plan-subtext" id="subtext-t24">24 Months</span>
                            </div>
                        </div>
                        <span class="badge">POPULAR</span>
                    </label>
                </div>

                <!-- 3-Year Option -->
                <div class="option-card">
                    <input type="radio" name="QBTAltumContractTenure" id="t36" value="36">
                    <label for="t36" class="option-label">
                        <div class="option-content">
                            <span class="radio-custom"></span>
                            <div class="plan-details">
                                <span class="plan-title">3-Year Plan</span>
                                <span class="plan-subtext" id="subtext-t36">36 Months</span>
                            </div>
                        </div>
                        <span class="badge">BEST VALUE</span>
                    </label>
                </div>
            </div>

            <!-- Primary Submit Button -->
            <button type="submit" class="btn-primary">Submit Renewal Selection</button>

            <!-- Secondary Decline Button -->
            <button type="button" class="btn-decline" onclick="handleDecline()">Decline Renewal</button>
        </form>
        <!-- FORM END -->
    </div>

    <!-- CREATIO SCRIPTS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="https://webtracking-v01.bpmonline.com/JS/track-cookies.js"></script>
    <script src="https://webtracking-v01.creatio.com/JS/create-object.js"></script>
    <script>
        var config = {
            fields: {
                "Number": "#QBTContractNumber",
                "Notes": "#RenewalAction" // Sends '12', '24', '36', or '0'
            },
            landingId: "ad4706b6-2532-4e3a-9746-1b48c70cc472",
            serviceUrl: "https://11008194-demo.creatio.com/0/ServiceModel/GeneratedObjectWebFormService.svc/SaveWebFormObjectData",
            redirectUrl: ""
        };

        function handleDecline() {
            if (confirm("Are you sure you want to decline contract renewal?")) {
                document.getElementById('RenewalAction').value = "0";
                createObject();
            }
        }

        function createObject() {
            var actionVal = document.getElementById('RenewalAction').value;

            if (actionVal !== "0" && actionVal !== "DECLINE") {
                var selectedRadio = document.querySelector("input[name='QBTAltumContractTenure']:checked");
                if (selectedRadio) {
                    document.getElementById('RenewalAction').value = selectedRadio.value;
                }
            }

            landing.createObjectFromLanding(config);
        }

        function initLanding() {
            landing.initLanding(config);

            var urlParams = new URLSearchParams(window.location.search);
            var targetValue = urlParams.get('contractNum');
            var contractName = urlParams.get('contractName');
            var priceParam = urlParams.get('price');

            // 1. Set hidden input for Creatio submission
            if (targetValue) {
                document.getElementById('QBTContractNumber').value = targetValue;
            }

            // 2. Populate Contract Name/Number Header
            var nameDisplay = document.getElementById('displayContractName');
            if (nameDisplay) {
                if (contractName && targetValue) {
                    nameDisplay.textContent = decodeURIComponent(contractName) + " (" + targetValue + ")";
                } else if (contractName) {
                    nameDisplay.textContent = decodeURIComponent(contractName);
                } else if (targetValue) {
                    nameDisplay.textContent = targetValue;
                }
            }

            // 3. Populate Price Information
            if (priceParam && !isNaN(priceParam)) {
                var price = parseFloat(priceParam);

                // Show banner rate
                document.getElementById('priceBanner').style.display = 'inline-block';
                document.getElementById('displayPrice').textContent = '$' + price.toLocaleString();

                // Dynamically update plan subtext options with total calculations
                document.getElementById('subtext-t12').textContent = '$' + (price * 1).toLocaleString() + ' total (1 year)';
                document.getElementById('subtext-t24').textContent = '$' + (price * 2).toLocaleString() + ' total (2 years)';
                document.getElementById('subtext-t36').textContent = '$' + (price * 3).toLocaleString() + ' total (3 years)';
            }
        }

        jQuery(document).ready(initLanding);
    </script>

</body>

</html>
